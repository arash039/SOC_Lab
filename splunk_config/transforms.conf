# --- SOC Lab: attack_data Windows XML field extraction ---
# One dynamic extraction covers every <Data Name='Field'>value</Data> pair,
# e.g. ProcessName, CommandLine, Image, TargetImage, GrantedAccess.
[soc_attack_xml_data]
REGEX = <Data Name='([^']+)'>([^<]*)</Data>
FORMAT = $1::$2

[soc_attack_xml_eventid]
REGEX = <EventID>(\d+)</EventID>
FORMAT = EventCode::$1

[soc_attack_xml_channel]
REGEX = <Channel>([^<]+)</Channel>
FORMAT = Channel::$1

[soc_attack_xml_computer]
REGEX = <Computer>([^<]+)</Computer>
FORMAT = Computer::$1
